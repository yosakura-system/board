<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ご確認</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--red:#990000;--ink:#26272e;--sub:#6b6d76;--line:#ded9d1;--bg:#f6f3ee;--card:#fff;--rule:#faf7f2;--menu:#edf3f8;--ok:#1e6b39}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Hiragino Sans","Yu Gothic","游ゴシック","Meiryo",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px;padding-bottom:120px}
header{background:#fff;border-bottom:4px solid var(--red);padding:18px 16px 14px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","游明朝",serif;font-size:22px;margin:0 0 4px;letter-spacing:.02em}
.lead{margin:0;color:var(--sub);font-size:14px}
.lead b{color:var(--ink)}
.now{margin-top:10px;background:var(--rule);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700}
.now.all{background:#e1f1e7;color:var(--ok)}
.saved{font-size:12px;color:var(--ok);margin:8px 0 0;min-height:18px}
.log{margin:0 auto 14px;font-size:13px;color:var(--sub)}
.log summary{cursor:pointer;padding:6px 2px}
.log ol{margin:6px 0 0;padding-left:22px}
.stat{font-size:13px;color:var(--sub);text-align:right;flex:none;max-width:55%}
.stat.ng{color:var(--red);font-weight:700}
main{padding:14px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;margin:0 0 14px;scroll-margin-top:12px}
.card.done{border-color:var(--ok)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.card.done .no{background:var(--ok)}
.qt,.bx,.opt .t,.why,.quote,.lead{text-wrap:pretty;word-break:auto-phrase}
.qt{text-wrap:balance}
.qt{font-size:18px;font-weight:700;line-height:1.4;padding-top:3px}
.why{font-size:13px;color:var(--sub);margin:0 0 10px}
.pic{width:100%;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:6px}
.cap{font-size:12px;color:var(--sub);margin:0 0 10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bx{border-radius:10px;padding:10px 12px;background:var(--rule);font-weight:700;font-size:15px;line-height:1.5}
.bx.m{background:var(--menu)}
.bx span{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-bottom:2px}
.quote{border-left:6px solid var(--red);background:var(--rule);padding:10px 12px;border-radius:0 10px 10px 0;font-weight:700;margin-bottom:10px}
.quote span{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:60px;cursor:pointer}
.opt .k{flex:none;width:32px;height:32px;border-radius:8px;border:2px solid var(--red);color:var(--red);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.opt .t{font-weight:700;font-size:16px;line-height:1.4}
.opt .t small{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.opt.on{border-color:var(--red);background:#fdf3f3}
.opt.on .k{background:var(--red);color:#fff}
.opt.skip{min-height:44px;padding:8px 14px;border-style:dashed}
.opt.skip .t{font-weight:400;font-size:14px;color:var(--sub)}
.opt.skip.on{background:#f1f1f1;border-color:#888;border-style:solid}
.memo{margin-top:10px}
.memo summary{font-size:14px;color:var(--sub);cursor:pointer;padding:6px 0}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:72px;resize:vertical;background:#fff;color:inherit}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
.bar .wrap{display:flex;gap:12px;align-items:center}
.prog{flex:1;font-size:14px;color:var(--sub)}
.prog b{font-size:20px;color:var(--ink)}
.dots{display:flex;gap:6px;margin-top:4px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--ok)}
.send{flex:none;font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--red);border:0;border-radius:12px;padding:14px 26px;min-height:54px;cursor:pointer}
.send[disabled]{background:#c9c4bc;cursor:default}
.fin{display:none;text-align:center;padding:48px 16px}
.fin h2{font-family:"Hiragino Mincho ProN","Yu Mincho","游明朝",serif;font-size:24px;margin:0 0 8px}
.fin .sum{display:inline-block;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:16px 0;font-size:16px;white-space:pre-line}
.fin button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;cursor:pointer}
.err{color:var(--red);font-size:14px;margin-top:8px}
.foot{font-size:12px;color:var(--sub);text-align:center;padding:4px 16px 0}
@media (min-width:600px){.opts.two{grid-template-columns:1fr 1fr}.opts.two .skip{grid-column:1/-1}}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.who{flex:none;background:var(--red);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;margin-top:4px;white-space:nowrap}
details.sec{background:transparent;margin:0 0 14px}
details.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#3a3d4d;color:#fff;border-radius:12px;padding:13px 14px;cursor:pointer;font-weight:700;font-size:16px;position:sticky;top:0;z-index:3}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .st::before{content:"▶";display:inline-block;margin-right:8px;font-size:12px;transition:transform .15s}
details.sec[open]>summary .st::before{transform:rotate(90deg)}
.sp{flex:none;background:#fff;color:#3a3d4d;border-radius:999px;padding:2px 10px;font-size:13px}
.sp.all{background:#cfe9d8;color:var(--ok)}
.note{font-size:13px;color:var(--sub);margin:10px 4px}
details.sec>.pic{margin:0 0 12px}
.items{margin-top:12px}
#sec_later>summary{background:#8a8c95}
.card.lt{opacity:.75}
.pic.th{max-width:300px;margin-left:auto;margin-right:auto}
a.open{color:var(--red);font-weight:700;text-decoration:none}
textarea.ans{min-height:84px}
.row{display:flex;justify-content:flex-end;margin-top:8px}
.savebtn{font:inherit;font-weight:700;color:#fff;background:var(--red);border:0;border-radius:10px;padding:10px 20px;min-height:44px;cursor:pointer}
.foot2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;min-height:36px}
.foot2 .saved{margin:0}
.later{font:inherit;font-size:13px;color:var(--sub);background:#fff;border:1px dashed #b9b4ab;border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer;flex:none}
.opts>.skip{grid-column:1/-1}
.opt.mtg{margin-top:0}
.opt.mtg.on{background:#edf3f8;border-color:#3b6ea5;border-style:solid}
.opt.mtg.on .t{color:#2b5a8c;font-weight:700}
.card.mt{border-color:#3b6ea5}
.card.mt .no{background:#3b6ea5}
.card.mt .saved{color:#2b5a8c}
textarea.ans+.row+.opts{margin-top:8px}
details.db{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 12px;padding:0 14px}
details.db>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:14px 0}
details.db>summary::-webkit-details-marker{display:none}
.dn{font-weight:700;font-size:18px}.dc{font-size:14px;color:var(--sub);text-align:right;grid-column:3}.dc b{font-size:22px;color:var(--ink)}
.dbar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.dbar i{display:block;height:100%;background:var(--ok)}
.dtags{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px}.dtags em{font-style:normal;font-size:12px;border-radius:999px;padding:2px 10px;background:#f1eee8;color:var(--sub)}
.dtags em.g{background:#edf3f8;color:#2b5a8c;font-weight:700}.dtags em.l{background:#f4efe6}.dtags em.ok{background:#e1f1e7;color:var(--ok);font-weight:700}
.dl{grid-column:3;font-size:12px;color:var(--sub);text-align:right}
table.dt{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px}table.dt td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}table.dt td:last-child{text-align:right;white-space:nowrap;width:1%}
tr.sh td{background:var(--rule);font-weight:700;font-size:13px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:#f1eee8;color:var(--sub)}
tr.k_done .chip{background:#e1f1e7;color:var(--ok);font-weight:700}tr.k_mtg .chip{background:#edf3f8;color:#2b5a8c;font-weight:700}tr.k_later .chip{background:#f4efe6;color:#7a6a45}
.dm{font-size:13px;color:#444;background:var(--rule);border-radius:8px;padding:6px 8px;margin-top:4px;white-space:pre-wrap}.da{font-size:11px;color:var(--sub);margin-top:2px}
#nav:empty{display:none}#nav{margin-top:10px}
.navb{display:inline-block;font-weight:700;font-size:15px;color:#fff;background:#3a3d4d;border-radius:10px;padding:10px 16px;text-decoration:none;min-height:44px}
.btns{display:flex;gap:8px;flex:none}
.undo{font:inherit;font-size:13px;color:var(--red);background:#fff;border:1px solid var(--red);border-radius:999px;padding:6px 14px;min-height:36px;cursor:pointer}
.card.lt .later{color:#fff;background:var(--red);border:1px solid var(--red);font-weight:700}
.pgw{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden;max-width:220px}
.pgw i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
@media (min-width:600px){.opts.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><h1 id="ttl"></h1><span class="who" id="who" style="display:none"></span></div>
  <p class="lead" id="lead"></p>
  <div id="nav"></div>
  <div class="now" id="now">読み込み中…</div>
</div></header>

<main class="wrap" id="form"></main>
<p class="foot wrap" id="foot"></p>

<details class="log wrap" id="logbox" style="padding:0 14px"><summary>これまでの動き（いつ・どれを押したか）</summary><ol id="log"></ol></details>

<div class="bar" id="bar" style="display:none"><div class="wrap">
  <div class="prog"><b id="cnt">0</b> / <span id="tot">0</span>　済み<div class="pgw"><i id="pg"></i></div></div>
  <div class="stat" id="stat"></div>
</div></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbzODhZcNZLI52k-ezXR90J7GOZmXhvnMKCROEWTGpoWExPOeBS43skdCnapJFqLECtC-Q/exec';
var K = (location.search.match(/[?&]k=([^&]+)/) || [])[1] || '';
var B = null, Q = [], QI = {}, S = {A:{}, M:{}, T:{}, log:[]}, IMG = {}, asked = {};
var OPENKEY = 'board_open_' + K;
function esc(x){ return String(x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(t){ if (!t) return ''; var d = new Date(t), p = function(n){ return (n < 10 ? '0' : '') + n; }; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + p(d.getMinutes()); }
function $(id){ return document.getElementById(id); }
var form = $('form'), stat = $('stat');
function setStat(t, ng){ stat.textContent = t; stat.className = 'stat' + (ng ? ' ng' : ''); }
function isLater(q){ return S.A[q.id] === '保留'; }
function isMtg(q){ return S.A[q.id] === 'MTG'; }
function isDone(q){ if (isLater(q) || isMtg(q)) return false; return q.type === 'text' ? !!(S.M[q.id] || '').trim() : !!S.A[q.id]; }
function word(q, v){ if (v === 'MTG') return 'MTGで相談したい'; if (v === '保留') return 'あとに回した'; if (!v) return '取り消した'; var o = (q.o || []).filter(function(o){ return o[0] === v; })[0]; return v + '（' + (o ? o[1] : '') + '）'; }
function getOpen(){ try { return JSON.parse(localStorage.getItem(OPENKEY) || 'null'); } catch (e) { return null; } }
function setOpen(){ var o = {}; Array.prototype.forEach.call(document.querySelectorAll('details.sec'), function(d){ o[d.id] = d.open; }); try { localStorage.setItem(OPENKEY, JSON.stringify(o)); } catch (e) {} }
function fillImgs(){ Array.prototype.forEach.call(document.querySelectorAll('img[data-img]'), function(im){ var u = IMG[im.getAttribute('data-img')]; if (u && im.getAttribute('src') !== u) im.setAttribute('src', u); }); }
function needImgs(secId){
  if (asked[secId]) return; asked[secId] = 1;
  fetch(API + '?k=' + encodeURIComponent(K) + '&sec=' + encodeURIComponent(secId)).then(function(r){ return r.json(); })
    .then(function(x){ if (x.ok && x.imgs) { for (var k in x.imgs) IMG[k] = x.imgs[k]; fillImgs(); } else asked[secId] = 0; })
    .catch(function(){ asked[secId] = 0; });
}
function build(b){
  B = b; Q = b.questions || []; QI = {}; Q.forEach(function(q, i){ QI[q.id] = i; });
  document.title = b.title || document.title;
  $('ttl').textContent = b.title || ''; $('lead').innerHTML = b.lead || ''; $('foot').textContent = b.foot || '';
  $('who').textContent = b.user ? b.user + ' さん' : ''; $('who').style.display = b.user ? '' : 'none';
  $('nav').innerHTML = b.dash ? '<a class="navb" href="?k=' + encodeURIComponent(b.dash) + '&from=' + encodeURIComponent(K) + '">全員の進みを見る ▶</a>' : '';
  form.innerHTML = '';
  var open = getOpen(), secs = (b.sections || []).concat([{id: 'later', title: 'あとに回したもの', note: '「いまやる」を押すと、元の場所に戻ります。'}]);
  secs.forEach(function(s, i){
    var d = document.createElement('details'); d.className = 'sec'; d.id = 'sec_' + s.id;
    d.open = open ? !!open[d.id] : i === 0;
    var h = '<summary><span class="st">' + esc(s.title) + '</span><span class="sp" id="sp_' + s.id + '"></span></summary>';
    if (s.note) h += '<p class="note">' + esc(s.note) + '</p>';
    (s.imgs || []).forEach(function(k){ h += '<img class="pic" alt="" data-img="' + k + '">'; });
    d.innerHTML = h + '<div class="items" id="it_' + s.id + '"></div>';
    form.appendChild(d);
    d.addEventListener('toggle', function(){ setOpen(); if (d.open && s.id !== 'later') needImgs(s.id); });
    if (d.open && s.id !== 'later') needImgs(s.id);
  });
  Q.forEach(function(q){
    var c = document.createElement('section'); c.className = 'card'; c.id = q.id;
    var h = '<div class="qh"><div class="no"></div><div class="qt">' + esc(q.t) + '</div></div>';
    if (q.why) h += '<p class="why">' + esc(q.why) + '</p>';
    if (q.img) h += (q.link ? '<a href="' + esc(q.link) + '" target="_blank" rel="noopener">' : '') + '<img class="pic' + (q.thumb ? ' th' : '') + '" alt="" data-img="' + q.img + '">' + (q.link ? '</a>' : '');
    if (q.link) h += '<p class="cap"><a class="open" href="' + esc(q.link) + '" target="_blank" rel="noopener">▶ ' + esc(q.linkLabel || 'マニュアルを開く') + '</a></p>';
    h += (q.html || '');
    if (q.type === 'text') {
      h += '<textarea class="ans" data-m="' + q.id + '" placeholder="' + esc(q.ph || 'ここに書いてください') + '"></textarea><div class="row"><button type="button" class="savebtn">保存する</button></div><div class="opts"><button type="button" class="opt skip mtg" data-q="' + q.id + '" data-v="MTG"><span class="t">MTGで相談したい</span></button></div>';
    } else {
      h += '<div class="opts two">';
      q.o.forEach(function(o){ h += '<button type="button" class="opt" data-q="' + q.id + '" data-v="' + o[0] + '"><span class="k">' + o[0] + '</span><span class="t">' + esc(o[1]) + (o[2] ? '<small>' + esc(o[2]) + '</small>' : '') + '</span></button>'; });
      h += '<button type="button" class="opt skip mtg" data-q="' + q.id + '" data-v="MTG"><span class="t">MTGで相談したい</span></button></div><details class="memo"><summary>ひとこと（書かなくて大丈夫です）</summary><textarea data-m="' + q.id + '" placeholder="補足があれば"></textarea></details>';
    }
    h += '<div class="foot2"><span class="saved" id="sv_' + q.id + '"></span><span class="btns"><button type="button" class="undo" data-undo="' + q.id + '">取り消す</button><button type="button" class="later" data-later="' + q.id + '"></button></span></div>';
    c.innerHTML = h; $('it_' + q.sec).appendChild(c);
  });
  $('bar').style.display = '';
}
function paint(){
  if (!B) return;
  var n = 0, m = 0, g = 0, last = 0, per = {}, moved = false;
  Q.forEach(function(q){
    var card = $(q.id), v = S.A[q.id], later = isLater(q), done = isDone(q), target = $('it_' + (later ? 'later' : q.sec));
    if (card.parentNode !== target) { moved = true; }
    card.className = 'card' + (done ? ' done' : '') + (later ? ' lt' : '') + (isMtg(q) ? ' mt' : '');
    Array.prototype.forEach.call(card.querySelectorAll('.opt'), function(b){ var on = b.getAttribute('data-v') === v; b.className = b.className.replace(/ on$/, '') + (on ? ' on' : ''); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    var ta = card.querySelector('textarea');
    if (document.activeElement !== ta && ta.value !== (S.M[q.id] || '')) { ta.value = S.M[q.id] || ''; var dm = card.querySelector('details.memo'); if (dm && ta.value) dm.open = true; }
    $('sv_' + q.id).textContent = (done && S.T[q.id]) ? '保存済み　' + fmt(S.T[q.id]) : (isMtg(q) ? 'MTGで相談　' + fmt(S.T[q.id]) : '');
    card.querySelector('.later').textContent = later ? '↑ いまやる（元に戻す）' : 'あとに回す';
    card.querySelector('.undo').style.display = (!later && (S.A[q.id] || (S.M[q.id] || '').trim())) ? '' : 'none';
    per[q.sec] = per[q.sec] || [0, 0]; per[q.sec][1]++; if (done) { per[q.sec][0]++; n++; } if (later) m++; if (isMtg(q)) g++;
    if (S.T[q.id] > last) last = S.T[q.id];
  });
  if (moved) {
    Q.forEach(function(q){ $('it_' + (isLater(q) ? 'later' : q.sec)).appendChild($(q.id)); });
  }
  (B.sections || []).forEach(function(s){
    var p = per[s.id] || [0, 0], el = $('sp_' + s.id); el.textContent = p[0] + ' / ' + p[1]; el.className = 'sp' + (p[1] && p[0] === p[1] ? ' all' : '');
    var k = 0; Array.prototype.forEach.call($('it_' + s.id).children, function(c){ c.querySelector('.no').textContent = ++k; });
  });
  var k2 = 0; Array.prototype.forEach.call($('it_later').children, function(c){ c.querySelector('.no').textContent = ++k2; });
  $('sp_later').textContent = m ? m + ' 件' : ''; $('sec_later').style.display = m ? '' : 'none';
  $('cnt').textContent = n; $('tot').textContent = Q.length;
  $('pg').style.width = (Q.length ? Math.round(n * 100 / Q.length) : 0) + '%';
  var now = $('now'), all = Q.length && n === Q.length;
  now.className = 'now' + (all ? ' all' : '');
  now.textContent = all ? 'すべていただきました。ありがとうございます！（最後の更新 ' + fmt(last) + '）' : 'いまの状況：全部で ' + Q.length + ' 件・済み ' + n + ' 件' + (g ? '・MTGで相談 ' + g + ' 件' : '') + (m ? '・あとに回した ' + m + ' 件' : '') + (last ? '（最後の更新 ' + fmt(last) + '）' : '');
  var ol = $('log'); ol.innerHTML = '';
  (S.log || []).slice().reverse().forEach(function(e){
    var q = Q[QI[e.q]]; if (!q) return; var li = document.createElement('li');
    li.textContent = fmt(e.t) + '　' + q.t.slice(0, 18) + (q.t.length > 18 ? '…' : '') + '：' + (e.k === 'm' ? (e.v || '書いた文を消した') : word(q, e.v));
    ol.appendChild(li);
  });
  $('logbox').style.display = (S.log && S.log.length) ? '' : 'none';
}
function take(x){ if (!x) return; S = {A: x.A || {}, M: x.M || {}, T: x.T || {}, log: x.log || []}; paint(); }
var busy = 0, ready = false;
function send(q, k, v){
  if (k === 'a') S.A[q] = v; else S.M[q] = v; paint();
  busy++; setStat('保存中…');
  fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({k: K, q: q, kind: k, value: v})})
    .then(function(r){ return r.json(); })
    .then(function(x){ busy--; if (!x.ok) throw new Error(x.error || 'ng'); if (!busy) take(x.state); setStat('保存しました'); })
    .catch(function(){ busy--; setStat('保存できませんでした。もう一度お願いします', true); });
}
function load(first){
  if (busy) return;
  fetch(API + '?k=' + encodeURIComponent(K) + (first ? '&board=1' : '') + '&_=' + Date.now()).then(function(r){ return r.json(); })
    .then(function(x){
      if (!x.ok) throw new Error(x.error || 'ng');
      if (x.dash) { dash(x.dash); ready = true; if (first) setStat(''); return; }
      if (x.board) { build(x.board); ready = true; }
      if (!busy && ready) take(x.state);
      if (first) setStat('');
    })
    .catch(function(){ if (first) $('now').textContent = '開けませんでした。リンクをもう一度押してください。'; });
}
function dash(d){
  var from = (location.search.match(/[?&]from=([^&]+)/) || [])[1] || '', me = null;
  d.boards.forEach(function(b){ if (b.k === decodeURIComponent(from)) me = b; });
  $('nav').innerHTML = me ? '<a class="navb" href="?k=' + encodeURIComponent(me.k) + '">◀ ' + esc(me.user) + 'さんの窓口へ戻る</a>' : '';
  document.title = d.title; $('ttl').textContent = d.title; $('who').style.display = 'none'; $('bar').style.display = 'none'; $('logbox').style.display = 'none';
  $('lead').textContent = 'ボードごとの進みです。20秒ごとに新しくなります。名前の行を押すと、項目ごとの答えが開きます。'; $('foot').textContent = '';
  var T = 0, Dn = 0, G = 0, L = 0, last = 0, open = {};
  Array.prototype.forEach.call(document.querySelectorAll('details.db'), function(x){ open[x.id] = x.open; });
  var h = '';
  d.boards.forEach(function(b){
    T += b.total; Dn += b.done; G += b.mtg; L += b.later; if (b.last > last) last = b.last;
    var rest = b.total - b.done - b.mtg - b.later, pc = b.total ? Math.round(b.done * 100 / b.total) : 0, id = 'db_' + b.k;
    h += '<details class="db" id="' + id + '"' + (open[id] ? ' open' : '') + '><summary><span class="dn">' + esc(b.user) + ' さん</span><span class="dc"><b>' + b.done + '</b> / ' + b.total + '</span><span class="dbar"><i style="width:' + pc + '%"></i></span>'
      + '<span class="dtags">' + (b.mtg ? '<em class="g">MTGで相談 ' + b.mtg + '</em>' : '') + (b.later ? '<em class="l">あとに回した ' + b.later + '</em>' : '') + (rest ? '<em>まだ ' + rest + '</em>' : '<em class="ok">全部済み</em>') + '</span><span class="dl">' + (b.last ? '最後の更新 ' + fmt(b.last) : 'まだ動きなし') + '</span></summary>';
    h += '<p class="cap"><a class="open" href="?k=' + encodeURIComponent(b.k) + '" target="_blank" rel="noopener">▶ ' + esc(b.user) + 'さんのボードを開く</a>（開いて押すと、本人の答えとして保存されます）</p><table class="dt">';
    var sec = '';
    b.items.forEach(function(it){
      if (it.sec !== sec && b.items.some(function(x){ return x.sec !== b.items[0].sec; })) { sec = it.sec; h += '<tr class="sh"><td colspan="2">' + esc(sec) + '</td></tr>'; }
      var lab = it.kind === 'done' ? (it.lab || '記入あり') : it.kind === 'mtg' ? 'MTGで相談' : it.kind === 'later' ? 'あとに回した' : '—';
      h += '<tr class="k_' + (it.kind || 'none') + '"><td>' + esc(it.t) + (it.m ? '<div class="dm">' + esc(it.m) + '</div>' : '') + '</td><td><span class="chip">' + esc(lab) + '</span>' + (it.at ? '<div class="da">' + fmt(it.at) + '</div>' : '') + '</td></tr>';
    });
    h += '</table></details>';
  });
  form.innerHTML = h;
  $('now').className = 'now'; $('now').textContent = '全体：' + T + ' 件のうち 済み ' + Dn + ' 件' + (G ? '・MTGで相談 ' + G + ' 件' : '') + (L ? '・あとに回した ' + L + ' 件' : '') + (last ? '（最後の更新 ' + fmt(last) + '）' : '');
}
function nextIn(q){
  var cards = $(q).parentNode ? Array.prototype.slice.call($('it_' + Q[QI[q]].sec).children) : [], i = cards.indexOf($(q));
  for (var k = i + 1; k < cards.length; k++) { if (!isDone(Q[QI[cards[k].id]])) return cards[k]; }
  return null;
}
form.addEventListener('click', function(e){
  var t = e.target, lt = t.closest ? t.closest('.later') : null, b = t.closest ? t.closest('.opt') : null;
  if (lt) { var id = lt.getAttribute('data-later'); send(id, 'a', S.A[id] === '保留' ? '' : '保留'); return; }
  var ud = t.closest ? t.closest('.undo') : null;
  if (ud) { var u = ud.getAttribute('data-undo'); if (S.A[u]) send(u, 'a', ''); if ((S.M[u] || '').trim()) send(u, 'm', ''); return; }
  if (!b) return;
  var q = b.getAttribute('data-q'), v = b.getAttribute('data-v'), qq = Q[QI[q]];
  if (S.A[q] === v) return;
  var nx = nextIn(q);
  send(q, 'a', v);
  var o = (qq.o || []).filter(function(o){ return o[0] === v; })[0];
  if (o && o[3]) { var d = $(q).querySelector('details.memo'); d.open = true; d.querySelector('textarea').focus(); return; }
  if (nx) setTimeout(function(){ nx.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 300);
});
form.addEventListener('change', function(e){
  var q = e.target.getAttribute && e.target.getAttribute('data-m'); if (!q) return;
  var v = e.target.value.replace(/\s+$/, ''); if (v !== (S.M[q] || '')) send(q, 'm', v);
});
if (!K) { $('now').textContent = 'リンクが正しくありません。届いたリンクをそのまま押してください。'; }
else {
  load(true);
  setInterval(function(){ if (ready && document.visibilityState !== 'hidden') load(false); }, 20000);
  document.addEventListener('visibilitychange', function(){ if (ready && document.visibilityState === 'visible') load(false); });
}
</script>
</body>
